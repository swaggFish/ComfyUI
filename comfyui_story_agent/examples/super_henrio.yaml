title: "Super Henrio: The Mushroom Quest"
fps: 25
style_prompt: "16-bit pixel art style, vibrant saturated colors, detailed character sprites, clean pixel-perfect linework, retro gaming aesthetic, SNES-era graphics, bold sprite outlines, parallax background layers, classic platformer look"
negative_prompt: "blurry, smooth, photorealistic, 3D render, CGI, anti-aliased, smudged pixels, gradient shading, realistic lighting, 4K, 8K"
output_dir: "output/super_henrio_hybrid_slow"

shots:
