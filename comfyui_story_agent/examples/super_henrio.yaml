    prompt: "Establishing shot of Henrio, a boy in a yellow shirt and red shorts, jumping over a pit in a bright Mushroom Kingdom. Lush green hills, giant mushrooms, and a blue sky with blocky clouds in the background."
    duration_frames: 81
    camera: "tracking"
    transition_in: "cut"
    first_frame_path: "output/super_henrio_anchors/shot_001.png"
    seed: -1
    width: 1024
    height: 576

