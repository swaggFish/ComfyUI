# ══════════════════════════════════════════════════════════════════════
# Lucy's Time-Traveling Adventures — Watercolor Reshoot
# ══════════════════════════════════════════════════════════════════════
# Style: Watercolor (Dreamlike, soft edges, paper texture)
# Anchors: Provided JPGs mapped to 6 shots
# ══════════════════════════════════════════════════════════════════════

title: "Lucy's Time-Traveling Adventures (Watercolor)"
style: watercolor
fps: 25
output_dir: "output/lucy_watercolor"

shots:
  - shot_id: 1
    prompt: >-
      Watercolor animation style. Lucy, a cute blonde girl around 5 years old,
      happily eating a large swirl ice cream cone in front of a retro diner/store.
      Soft edges, translucent color washes, paper texture visible. 
    duration_frames: 97
    camera: push_in
    transition_in: cut
    seed: -1
    width: 1024
    height: 576
    first_frame_path: "output/lucy_watercolor_anchors/shot_001.jpg"

  - shot_id: 2
    prompt: >-
      Watercolor animation style. Lucy wears a pink pioneer bonnet and dress.
      She is sitting in a sunlit prairie meadow in the American old west,
      waving at friendly horses. Dreamlike, soft brush strokes.
    duration_frames: 97
    camera: tracking
    transition_in: crossfade
    transition_duration: 1.0
    seed: -1
    width: 1024
    height: 576
    first_frame_path: "output/lucy_watercolor_anchors/shot_002.jpg"

  - shot_id: 3
    prompt: >-
      Watercolor animation style. Lucy in a magical playroom/rehearsal space,
      hanging upside down from a colorful fabric swing. A giant rainbow cloud
      is painted on the ceiling. Soft flowing paint effects.
    duration_frames: 97
    camera: static
    transition_in: crossfade
    transition_duration: 1.0
    seed: -1
    width: 1024
    height: 576
    first_frame_path: "output/lucy_watercolor_anchors/shot_003.jpg"

  - shot_id: 4
    prompt: >-
      Watercolor animation style. Lucy performing a dance on a theater stage.
      She wears a sparkly pink leotard and rainbow tutu. Spotlights create
      glowing color washes. Artistic and dreamlike.
    duration_frames: 97
    camera: orbit_cw
    transition_in: crossfade
    transition_duration: 1.0
    seed: -1
    width: 1024
    height: 576
    first_frame_path: "output/lucy_watercolor_anchors/shot_004.jpg"

  - shot_id: 5
    prompt: >-
      Watercolor animation style. Lucy sits on dramatic red sandstone rocks
      in a Utah canyon. Warm desert sunlight, soft edges, paper texture.
      Natural arches tower above her.
    duration_frames: 97
    camera: crane_up
    transition_in: crossfade
    transition_duration: 1.0
    seed: -1
    width: 1024
    height: 576
    first_frame_path: "output/lucy_watercolor_anchors/shot_005.jpg"

  - shot_id: 6
    prompt: >-
      Watercolor animation style. Lucy arriving back home at sunset.
      She waves happily, her ice cream cone from the start is back.
      Golden hour lighting, soft flowing paint effects. The end.
    duration_frames: 97
    camera: pull_out
    transition_in: crossfade
    transition_duration: 1.0
    seed: -1
    width: 1024
    height: 576
    first_frame_path: "output/lucy_watercolor_anchors/shot_006.jpg"
