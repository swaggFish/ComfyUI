title: 'Semrush — Be Found First (v3)'
style: photorealistic
fps: 24
style_prompt: >-
  photorealistic, 8k resolution, cinematic lighting, highly detailed,
  professional cinematography, shallow depth of field, color graded,
  commercial advertisement quality
negative_prompt: >-
  cartoon, animated, illustration, low quality, deformed, blurry,
  text overlay, watermark, logo, split screen, multiple scenes,
  slow motion, timelapse
output_dir: ./output/story
shots:

# ─── Scene 1: Dashboard / Traffic Growth ────────────────────────
- shot_id: 1
  prompt: >-
    Cinematic slow pan across a sleek modern office desk. A glowing laptop screen
    displays a professional analytics dashboard with dramatically rising traffic
    charts in green and blue. Warm professional office lighting with soft bokeh
    background. A cup of coffee sits beside the laptop. The charts animate upward
    showing exponential growth. Clean, minimal, premium tech aesthetic.
  duration_frames: 97
  camera: pan right
  transition_in: cut
  transition_duration: 0.5
