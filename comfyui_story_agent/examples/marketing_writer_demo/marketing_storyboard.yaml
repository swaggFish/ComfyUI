    nightstand. The device has a soft, glowing light and is made of matte white and
    brushed metal materials. A hand gently places it on the nightstand.
  duration_frames: 30
  camera: Macro shot, focus pull from background to the device.
  transition_in: dissolve
  transition_duration: 0.5
  first_frame_path: null
  last_frame_path: null
  seed: -1
  width: 1280
  height: 704
  style_override: null
  skill: null
  expected_text: Introducing DreamWeave.
- shot_id: 3
