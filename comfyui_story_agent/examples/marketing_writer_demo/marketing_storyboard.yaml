title: 'DreamWeave: The Future of Sleep'
style: comic
fps: 4
style_prompt: cinematic, hyper-realistic, 8k, soft focus, luxurious bedroom, calm,
  serene, premium materials, warm ambient lighting, natural textures, lifestyle photography
negative_prompt: blurry, low-quality, cartoon, anime, ugly, cluttered, harsh lighting,
  medical device, hospital, messy
output_dir: ./output/story
shots:
- shot_id: 1
  prompt: A stylish young professional tossing and turning in a beautifully designed,
    minimalist bedroom at night, face showing subtle frustration, moonlight streaming
    through the window.
  duration_frames: 30
  camera: Medium shot, slow dolly pull-back.
  transition_in: cut
  transition_duration: 0.5
  first_frame_path: null
  last_frame_path: null>
  seed: -1
  width: 1280
  height: 704
  style_override: null
  skill: null
  expected_text: Tired of restless nights?
- shot_id: 2
