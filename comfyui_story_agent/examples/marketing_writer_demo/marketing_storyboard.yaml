  duration_frames: 30
  camera: Overhead top-down shot, slow, almost imperceptible zoom-in.
  transition_in: dissolve
  transition_duration: 0.5
  first_frame_path: null
  last_frame_path: null
  seed: -1
  width: 1280
  height: 704
  style_override: null
